receivers:
  # Default OTLP receiver on localhost only
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  # Scrape host metrics automatically every minute
  host_metrics:
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      process:
      processes:
      paging:
      system:
  # Events from Event Log
  windows_event_log:
    channel: application
    # Uncomment to scrape logs from a directory and enter receiver-name into logs/traces pipeline.
    # Automatically attaches to the end of each discovered log file.
    # Multiple formats can be used.
    # For further information please see: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/filelogreceiver
    # file_log:
    #   include:
    #     - /path/to/logfiles/*.log
# Further processing for collected data
processors:
  memory_limiter:
    check_interval: 10s
    limit_mib: 1000
    spike_limit_mib: 500
  resource_detection/system:
    detectors:
      - system
    override: false
    system:
      resource_attributes:
        host.ip:
          enabled: true
        os.name:
          enabled: true
        os.type:
          enabled: true
        os.version:
          enabled: true
  resources:
    attributes:
      # TODO: ensure this is set per customer
      - key: tenant_id
        value: "AE"
        action: upsert
      - key: environment
        value: "PROD"
        action: upsert
        # - key: host.name
        #   value: "hostname"
        #   action: upsert
  batch:
    timeout: 60s
exporters:
  otlp_grpc:
    endpoint: 10.10.240.11:4317
    tls:
      ca_file: ./cert/ca.pem
      cert_file: ./cert/client-cert.pem
      key_file: ./cert/client-key.pem
      insecure: false
      # Use Self Signed Certificates
      insecure_skip_verify: true
    # Persist Data on Disk in case the exporter fails e.g. because of no network
    sending_queue:
      storage: file_storage
extensions:
  file_storage:
    directory: ./queue
    create_directory: true
service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource_detection/system
        - resources
        - batch
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp, host_metrics]
      processors:
        - memory_limiter
        - resource_detection/system
        - resources
        - batch
      exporters: [otlp_grpc]
    logs:
      receivers: [otlp, windows_event_log]
      processors:
        - memory_limiter
        - resource_detection/system
        - resources
        - batch
      exporters: [otlp_grpc]
