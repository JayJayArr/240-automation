- hosts: docker
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
    - name: Upgrade the OS (apt-get dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
    - name: Install vim and python3-requests
      ansible.builtin.apt:
        pkg:
          - vim
          - python3-requests
        update_cache: yes
    - name: Autoclean
      ansible.builtin.apt:
        autoclean: yes
    - name: Autoremove
      ansible.builtin.apt:
        autoremove: yes
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: no
      register: reboot_required_file
    - name: Reboot if required
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists == true
