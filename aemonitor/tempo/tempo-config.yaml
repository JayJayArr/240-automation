stream_over_http_enabled: true
server:
  http_listen_port: 3200
# Only OTLP/gRPC ingestion is enabled. The collector reaches this endpoint
# through the private Docker network as tempo:4317.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
usage_report:
  reporting_enabled: false
