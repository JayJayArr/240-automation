stream_over_http_enabled: true
server:
  http_listen_port: 3200
# Only OTLP/gRPC ingestion is enabled. The collector reaches this endpoint
# through the private Docker network as tempo:4317.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 336h # 336 hours is 14 days
query_frontend:
  metrics:
    max_duration: 0
  search:
    max_duration: 0
