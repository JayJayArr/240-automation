receivers:
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          client_ca_file: /etc/certs/root-ca.pem
          cert_file: /etc/certs/server-cert.pem
          key_file: /etc/certs/server-key.pem
          # min_version: "1.2" defaults to 1.2
          # Use Self Signed Certificates
      http:
        endpoint: 0.0.0.0:4318
        # tls:
        #   client_ca_file: /etc/certs/ca.pem
        #   cert_file: /etc/certs/server-cert.pem
        #   key_file: /etc/certs/server-key.pem
        #   min_version: "1.2"
        # Use Self Signed Certificates
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 128
  batch:
    timeout: 10s
    send_batch_size: 8192
exporters:
  # Loki 3.x native OTLP log ingestion. The exporter appends /v1/logs.
  otlp_http/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      queue_size: 10000
      storage: file_storage/loki
  # Prometheus must have --web.enable-otlp-receiver enabled, see compose.yaml
  otlp_http/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
    # remote_write_queue:
    #   enabled: true
    #   num_consumers: 5
    #   queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      queue_size: 10000
      storage: file_storage/prometheus
  # Tempo OTLP/gRPC endpoint.
  otlp_grpc/tempo:
    endpoint: ${env:TEMPO_OTLP_GRPC_ENDPOINT}
    tls:
      insecure: ${env:TEMPO_TLS_INSECURE}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      # num_consumers: 5 # default is 10
      queue_size: 10000
      storage: file_storage/tempo
extensions:
  file_storage/loki:
    directory: /var/lib/otelcol/file_storage/loki
    create_directory: true
    recreate: true
  file_storage/tempo:
    directory: /var/lib/otelcol/file_storage/tempo
    create_directory: true
    recreate: true
  file_storage/prometheus:
    directory: /var/lib/otelcol/file_storage/prometheus
    create_directory: true
    recreate: true
service:
  extensions: [file_storage/loki, file_storage/tempo, file_storage/prometheus]
  pipelines:
    traces:
      receivers: [otlp/grpc]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp/grpc]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp/grpc]
      processors: [batch]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
