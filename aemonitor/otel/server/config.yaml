receivers:
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          client_ca_file: /etc/certs/ca.pem
          cert_file: /etc/certs/server-cert.pem
          key_file: /etc/certs/server-key.pem
          min_version: "1.2"
          # Use Self Signed Certificates
      http:
        endpoint: 0.0.0.0:4318
        # tls:
        #   client_ca_file: /etc/certs/ca.pem
        #   cert_file: /etc/certs/server-cert.pem
        #   key_file: /etc/certs/server-key.pem
        #   min_version: "1.2"
        # Use Self Signed Certificates
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 8192
exporters:
  # Loki 3.x native OTLP log ingestion. The exporter appends /v1/logs.
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  # Prometheus must have --web.enable-otlp-receiver enabled, see compose.yaml
  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
    remote_write_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  # Tempo OTLP/gRPC endpoint.
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_GRPC_ENDPOINT}
    tls:
      insecure: ${env:TEMPO_TLS_INSECURE}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000
service:
  pipelines:
    traces:
      receivers: [otlp/grpc]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp/grpc]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp/grpc]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
